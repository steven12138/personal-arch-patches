# Extreme power policy for this Lenovo Legion Y9000P IAH7H.
# AC automatically selects performance; battery automatically selects SAV.

TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=SAV

# Performance profile: fixed hardware maximum, all boost paths enabled.
CPU_DRIVER_OPMODE_ON_AC=active
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_MIN_FREQ_ON_AC=4900000
CPU_SCALING_MAX_FREQ_ON_AC=4900000
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_MIN_PERF_ON_AC=100
CPU_MAX_PERF_ON_AC=100
CPU_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_AC=1
PLATFORM_PROFILE_ON_AC=performance
INTEL_GPU_MIN_FREQ_ON_AC=100
INTEL_GPU_MAX_FREQ_ON_AC=1450
INTEL_GPU_BOOST_FREQ_ON_AC=1450
PCIE_ASPM_ON_AC=default

# Balanced profile: retained as a low-power fallback for manual selection.
CPU_DRIVER_OPMODE_ON_BAT=passive
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_MIN_FREQ_ON_BAT=400000
CPU_SCALING_MAX_FREQ_ON_BAT=400000
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=5
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_BAT=0
PLATFORM_PROFILE_ON_BAT=low-power
INTEL_GPU_MIN_FREQ_ON_BAT=100
INTEL_GPU_MAX_FREQ_ON_BAT=100
INTEL_GPU_BOOST_FREQ_ON_BAT=100
PCIE_ASPM_ON_BAT=powersupersave

# Power-saver profile: clamp CPU and Intel GPU to their validated minima.
CPU_DRIVER_OPMODE_ON_SAV=passive
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_SCALING_MIN_FREQ_ON_SAV=400000
CPU_SCALING_MAX_FREQ_ON_SAV=400000
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=1
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_SAV=0
PLATFORM_PROFILE_ON_SAV=low-power
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving
INTEL_GPU_MIN_FREQ_ON_SAV=100
INTEL_GPU_MAX_FREQ_ON_SAV=100
INTEL_GPU_BOOST_FREQ_ON_SAV=100
PCIE_ASPM_ON_SAV=powersupersave

# Storage, PCIe, radios, audio, USB, and suspend behavior.
DISK_IDLE_SECS_ON_BAT=2
MAX_LOST_WORK_SECS_ON_BAT=60
DISK_DEVICES="nvme0n1 nvme1n1"
DISK_IOSCHED="keep keep"
SATA_LINKPWR_ON_AC="med_power_with_dipm"
SATA_LINKPWR_ON_BAT="min_power"
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=15
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
WOL_DISABLE=Y
DEVICES_TO_DISABLE_ON_BAT="bluetooth"
DEVICES_TO_ENABLE_ON_AC="bluetooth"
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
USB_AUTOSUSPEND=1
USB_ALLOWLIST="048d:c102"
USB_EXCLUDE_BTUSB=0
MEM_SLEEP_ON_AC=s2idle
MEM_SLEEP_ON_BAT=deep
NMI_WATCHDOG=0
