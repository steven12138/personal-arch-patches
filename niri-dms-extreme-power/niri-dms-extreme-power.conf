# Display and brightness policy used by niri-power-refresh.
PANEL_OUTPUT="eDP-1"
PERFORMANCE_MODE="2560x1600@165.004"
BALANCED_MODE="2560x1600@60.002"
POWER_SAVER_MODE="2560x1600@60.002"
POWER_SAVER_BRIGHTNESS="20%"
PERFORMANCE_FALLBACK_BRIGHTNESS="35%"

# System services controlled by apply-system-profile.
MANAGE_BLUETOOTH=1
MANAGE_NVIDIA_POWERD=1
MANAGE_NVIDIA_GPU=1
REMOVE_NVIDIA_ON_POWER_SAVER=1
# Experiment: when both Legion fans are already stopped in power-saver, freeze
# that 0 RPM state. Missing driver/sensor nodes are ignored; leaving
# power-saver always restores the EC's automatic fan controller.
LOCK_FANS_ON_POWER_SAVER=1
NIRI_IGNORE_NVIDIA_GPU=1
NVIDIA_PCI_DEVICE="0000:01:00.0"
NVIDIA_AUDIO_PCI_DEVICE="0000:01:00.1"
NVIDIA_PARENT_PCI_DEVICE="0000:00:01.0"
NVIDIA_DRM_DEVICE="/dev/dri/by-path/pci-0000:01:00.0-render"
